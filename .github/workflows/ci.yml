name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A pipeline bug is often version-specific; one red cell must not hide
      # the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Example — console_app
        working-directory: examples
        run: python console_app/main.py

      - name: Example — ecommerce parity suite
        working-directory: examples
        run: python ecommerce/main.py

  free-threaded:
    name: free-threaded ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the GIL is actually disabled
        run: |
          python -c "import sys; assert not sys._is_gil_enabled(), 'GIL is still on'; print('free-threaded OK')"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Example — ecommerce parity suite
        working-directory: examples
        run: python ecommerce/main.py

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[typecheck]"

      - name: mypy
        run: python -m mypy src/py_mediatR

  web-examples:
    name: web examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r examples/requirements.txt httpx

      - name: FastAPI, Flask and Django routes
        working-directory: examples
        run: python -m ci_smoke

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Assert py.typed and the lowercase alias ship
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("py_mediatR/py.typed", "py_mediatr.py"):
              assert required in names, f"{required} missing from wheel"
          print("wheel contents OK")
          PY

      - name: Both import names resolve from the installed wheel
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/python -m pip install -q dist/*.whl
          /tmp/probe/bin/python -c "import py_mediatR, py_mediatr; assert py_mediatr.Mediator is py_mediatR.Mediator; print(py_mediatR.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
