[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mediatR"
version = "6.7.1"
description = ".NET MediatR-inspired high-performance CQRS/Mediator for Python: async pipeline, notifications, streaming, DI (singleton/scoped/transient), CancellationToken, auto-discovery, free-threaded (no-GIL) ready."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ayhan Öztemel", email = "ayhanoztemel@hotmail.com" }]
requires-python = ">=3.10"
keywords = ["mediatr", "cqrs", "mediator", "pipeline", "di", "dependency-injection", "cancellation", "nogil", "free-threaded"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=1.10"]
# Test-only, deliberately free of anything that needs a compiler: twine pulls in
# nh3 (Rust), which has no free-threaded wheel and cannot build on 3.13t.
test = ["pytest>=7", "pytest-asyncio>=0.23"]
# Deliberately separate from `test` and `dev`, both of which run on 3.10 and on
# free-threaded builds: mypy pulls in ast-serialize (PyO3), which requires
# CPython 3.11+. Pinned so a new mypy release cannot turn CI red on its own.
typecheck = ["mypy==2.3.1"]
# Also kept out of `test`: coverage ships a C tracer, so it is the same class of
# risk as nh3 and ast-serialize on free-threaded builds. The gate runs on a
# single ubuntu/3.12 job, which never needs a compiler-free install.
coverage = ["pytest>=7", "pytest-asyncio>=0.23", "coverage[toml]>=7"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "build", "twine"]

[project.urls]
Homepage = "https://github.com/AyhanOztemel/py_mediatR"
Source = "https://github.com/AyhanOztemel/py_mediatR"
Issues = "https://github.com/AyhanOztemel/py_mediatR/issues"
Changelog = "https://github.com/AyhanOztemel/py_mediatR/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# Lowercase alias so `import py_mediatr` also works on case-sensitive filesystems.
[tool.setuptools]
py-modules = ["py_mediatr"]

[tool.setuptools.package-data]
py_mediatR = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["py_mediatR"]
# The gate measures pytest and the examples in separate processes, so each run
# must write its own data file for `coverage combine` to merge.
parallel = true

[tool.coverage.report]
# The floor is the measured baseline (79%) minus headroom, not an aspiration:
# it exists to catch a drop, so raise it only after coverage actually rises.
fail_under = 75
show_missing = true
skip_covered = true

[tool.mypy]

# pydantic is optional and guarded by try/except ImportError, so the type
# checker must not require it to be installed. _PydBaseModel is Any either
# way, so nothing is lost by not resolving the real class.
[[tool.mypy.overrides]]
module = ["pydantic"]
ignore_missing_imports = true
